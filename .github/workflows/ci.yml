name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java for disposable Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install local test tools
        run: |
          npm install --global firebase-tools@15.9.1
          npx playwright install --with-deps chromium

      - name: Verify production dependencies, types, API, Firestore, browser and build
        run: npm run verify:pr13

      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr13-verification-${{ github.sha }}
          path: |
            .verification/pr13/
            playwright-report/
            test-results/
          include-hidden-files: true
